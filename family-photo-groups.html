<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Find Your Photo Group</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,700;9..144,900&family=Space+Grotesk:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root {
    --charcoal: #1b1b1e;
    --charcoal-2: #26262a;
    --paper: #efe3c0;
    --paper-2: #e6d8ab;
    --ink: #2b2620;
    --ink-soft: #5a5346;
    --red: #b23b28;
    --gold: #a97e2b;
    --green: #5c6b4c;
  }

  * { box-sizing: border-box; }

  html, body {
    margin: 0;
    padding: 0;
    min-height: 100%;
    background: var(--charcoal);
    background-image:
      radial-gradient(circle at 20% 15%, rgba(255,255,255,0.035), transparent 40%),
      radial-gradient(circle at 85% 80%, rgba(255,255,255,0.03), transparent 45%);
    font-family: 'Space Grotesk', sans-serif;
    color: var(--paper);
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 40px 16px;
  }

  .stage {
    width: 100%;
    max-width: 460px;
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 22px;
  }

  .kicker {
    font-size: 13px;
    letter-spacing: 0.02em;
    color: rgba(239,227,192,0.55);
    text-align: center;
  }

  .kicker strong { color: var(--paper); font-weight: 600; }

  /* --- Ticket --- */
  .ticket {
    position: relative;
    width: 100%;
    background: var(--paper);
    color: var(--ink);
    transform: rotate(-0.6deg);
    box-shadow: 10px 14px 0 rgba(0,0,0,0.35);
    padding: 34px 30px 28px;
    font-family: 'Space Grotesk', sans-serif;
  }

  .ticket::before, .ticket::after {
    content: "";
    position: absolute;
    width: 26px;
    height: 26px;
    background: var(--charcoal);
    border-radius: 50%;
    top: 50%;
    transform: translateY(-50%);
    box-shadow: 0 0 0 4px rgba(0,0,0,0.15) inset;
  }
  .ticket::before { left: -13px; }
  .ticket::after { right: -13px; }

  .perf {
    position: absolute;
    top: 0;
    bottom: 0;
    left: 50%;
    border-left: 2px dashed rgba(43,38,32,0.25);
    display: none;
  }

  .ticket-title {
    font-family: 'Fraunces', serif;
    font-weight: 700;
    font-size: 28px;
    line-height: 1.1;
    margin: 0 0 6px;
  }

  .ticket-sub {
    font-size: 14px;
    color: var(--ink-soft);
    margin: 0 0 24px;
  }

  .field-label {
    font-size: 12px;
    letter-spacing: 0.08em;
    text-transform: uppercase;
    color: var(--ink-soft);
    display: block;
    margin-bottom: 8px;
  }

  .name-row {
    display: flex;
    gap: 10px;
  }

  input[type="text"] {
    flex: 1;
    font-family: 'Space Grotesk', sans-serif;
    font-size: 17px;
    padding: 12px 14px;
    border: 2px solid var(--ink);
    background: #fbf6e9;
    color: var(--ink);
    outline: none;
  }
  input[type="text"]:focus { border-color: var(--red); }

  button {
    font-family: 'Space Grotesk', sans-serif;
    font-weight: 600;
    cursor: pointer;
    border: none;
  }

  .btn-primary {
    background: var(--red);
    color: var(--paper);
    font-size: 15px;
    padding: 0 20px;
    border: 2px solid var(--ink);
  }
  .btn-primary:hover { background: #9c331f; }
  .btn-primary:disabled { opacity: 0.5; cursor: not-allowed; }

  .result {
    margin-top: 24px;
    display: none;
  }
  .result.show { display: block; }

  .result-divider {
    border-top: 2px dashed rgba(43,38,32,0.3);
    margin-bottom: 22px;
  }

  .result-found {
    display: flex;
    align-items: center;
    gap: 20px;
  }

  .group-number {
    font-family: 'Fraunces', serif;
    font-weight: 900;
    font-size: 76px;
    line-height: 0.9;
    color: var(--red);
    transform: scale(0.7);
    opacity: 0;
    transition: transform 0.35s cubic-bezier(.2,1.4,.4,1), opacity 0.25s ease;
  }
  .group-number.pop { transform: scale(1); opacity: 1; }

  .result-text p {
    margin: 0 0 4px;
    font-size: 13px;
    letter-spacing: 0.08em;
    text-transform: uppercase;
    color: var(--ink-soft);
  }
  .result-text h3 {
    margin: 0;
    font-family: 'Fraunces', serif;
    font-size: 20px;
  }

  .result-empty, .result-multi p {
    font-size: 15px;
    line-height: 1.5;
    margin: 0 0 12px;
  }

  .match-list {
    display: flex;
    flex-direction: column;
    gap: 8px;
  }
  .match-item {
    text-align: left;
    background: #fbf6e9;
    border: 2px solid var(--ink);
    padding: 10px 14px;
    font-size: 15px;
    color: var(--ink);
  }
  .match-item:hover { background: #f2e6c9; }

  .admin-link {
    background: none;
    color: rgba(239,227,192,0.45);
    font-size: 13px;
    text-decoration: underline;
    padding: 4px;
  }
  .admin-link:hover { color: rgba(239,227,192,0.75); }

  .admin-panel {
    width: 100%;
    background: var(--charcoal-2);
    border: 1px solid rgba(239,227,192,0.15);
    padding: 22px;
    display: none;
    font-size: 14px;
  }
  .admin-panel.show { display: block; }

  .admin-panel h4 {
    font-family: 'Fraunces', serif;
    margin: 0 0 4px;
    font-size: 18px;
    color: var(--paper);
  }
  .admin-panel p {
    color: rgba(239,227,192,0.6);
    line-height: 1.5;
    margin: 0 0 14px;
  }
  .admin-panel label {
    display: block;
    font-size: 12px;
    letter-spacing: 0.06em;
    text-transform: uppercase;
    color: rgba(239,227,192,0.55);
    margin-bottom: 6px;
  }
  .admin-panel input[type="text"].title-input {
    width: 100%;
    margin-bottom: 16px;
    background: var(--charcoal);
    border-color: rgba(239,227,192,0.3);
    color: var(--paper);
  }
  textarea {
    width: 100%;
    min-height: 160px;
    font-family: 'Space Grotesk', monospace;
    font-size: 14px;
    padding: 12px;
    background: var(--charcoal);
    color: var(--paper);
    border: 2px solid rgba(239,227,192,0.3);
    resize: vertical;
    margin-bottom: 14px;
  }
  .admin-actions {
    display: flex;
    gap: 10px;
    align-items: center;
    flex-wrap: wrap;
  }
  .btn-save {
    background: var(--green);
    color: #fff;
    padding: 10px 18px;
    font-size: 14px;
    border: 2px solid rgba(255,255,255,0.15);
  }
  .btn-save:hover { background: #4e5b40; }
  .status-msg {
    font-size: 13px;
    color: rgba(239,227,192,0.6);
  }
  .status-msg.ok { color: #b7c99e; }
  .status-msg.err { color: #e0968a; }

  .count-badge {
    display: inline-block;
    font-size: 12px;
    color: rgba(239,227,192,0.5);
    margin-bottom: 14px;
  }

  @media (max-width: 380px) {
    .group-number { font-size: 58px; }
    .ticket { padding: 28px 20px 22px; }
  }
</style>
</head>
<body>

<div class="stage">
  <div class="kicker" id="kicker"><strong>Family Photo</strong> · find your group before we line up</div>

  <div class="ticket">
    <h1 class="ticket-title" id="eventTitle">Find Your Photo Group</h1>
    <p class="ticket-sub" id="eventSub">Type your name and we'll tell you where to stand.</p>

    <span class="field-label">Your name</span>
    <div class="name-row">
      <input type="text" id="nameInput" placeholder="e.g. Priya Shah" autocomplete="off">
      <button class="btn-primary" id="searchBtn">Find</button>
    </div>

    <div class="result" id="result"></div>
  </div>

  <button class="admin-link" id="adminToggle">Organizer? Set up the guest list</button>

  <div class="admin-panel" id="adminPanel">
    <h4>Guest list</h4>
    <p>Paste one guest per line as <strong>Name, Group number</strong>. This list is saved and visible to anyone who opens this page, so only put names and group numbers here.</p>

    <label for="titleInput">Page heading</label>
    <input type="text" id="titleInput" class="title-input" placeholder="Find Your Photo Group">

    <label for="listInput">Guest list</label>
    <textarea id="listInput" placeholder="Priya Shah, 1
John Alvarez, 1
The Nguyen Family, 2
Grandma Rose, 1"></textarea>

    <div class="admin-actions">
      <button class="btn-save" id="saveBtn">Save guest list</button>
      <span class="status-msg" id="statusMsg"></span>
    </div>
    <div style="margin-top:14px;">
      <span class="count-badge" id="countBadge"></span>
    </div>
  </div>
</div>

<script>
(async function () {
  const nameInput = document.getElementById('nameInput');
  const searchBtn = document.getElementById('searchBtn');
  const resultEl = document.getElementById('result');
  const adminToggle = document.getElementById('adminToggle');
  const adminPanel = document.getElementById('adminPanel');
  const listInput = document.getElementById('listInput');
  const titleInput = document.getElementById('titleInput');
  const saveBtn = document.getElementById('saveBtn');
  const statusMsg = document.getElementById('statusMsg');
  const countBadge = document.getElementById('countBadge');
  const eventTitle = document.getElementById('eventTitle');
  const eventSub = document.getElementById('eventSub');

  const STORAGE_KEY = 'family-photo-groups-data';
  let guests = []; // [{name, group}]

  function normalize(s) {
    return s.trim().toLowerCase().replace(/\s+/g, ' ');
  }

  function parseGuestText(text) {
    const lines = text.split('\n').map(l => l.trim()).filter(Boolean);
    const parsed = [];
    for (const line of lines) {
      const parts = line.split(',');
      if (parts.length < 2) continue;
      const group = parts[parts.length - 1].trim();
      const name = parts.slice(0, parts.length - 1).join(',').trim();
      if (!name || !group) continue;
      parsed.push({ name, group });
    }
    return parsed;
  }

  function guestsToText(list) {
    return list.map(g => `${g.name}, ${g.group}`).join('\n');
  }

  async function loadData() {
    try {
      const res = await window.storage.get(STORAGE_KEY, true);
      if (res && res.value) {
        const data = JSON.parse(res.value);
        guests = data.guests || [];
        if (data.title) {
          eventTitle.textContent = data.title;
          titleInput.value = data.title;
        }
        if (data.sub) {
          eventSub.textContent = data.sub;
        }
      }
    } catch (e) {
      guests = [];
    }
    listInput.value = guestsToText(guests);
    updateCountBadge();
  }

  async function saveData() {
    const parsed = parseGuestText(listInput.value);
    const title = titleInput.value.trim() || 'Find Your Photo Group';
    const payload = { guests: parsed, title };
    try {
      const res = await window.storage.set(STORAGE_KEY, JSON.stringify(payload), true);
      if (!res) throw new Error('no result');
      guests = parsed;
      eventTitle.textContent = title;
      statusMsg.textContent = `Saved ${parsed.length} guest${parsed.length === 1 ? '' : 's'}.`;
      statusMsg.className = 'status-msg ok';
      updateCountBadge();
    } catch (e) {
      statusMsg.textContent = 'Could not save. Please try again.';
      statusMsg.className = 'status-msg err';
    }
  }

  function updateCountBadge() {
    countBadge.textContent = guests.length
      ? `${guests.length} guest${guests.length === 1 ? '' : 's'} currently loaded`
      : 'No guests loaded yet';
  }

  function renderFound(guest) {
    resultEl.innerHTML = `
      <div class="result-divider"></div>
      <div class="result-found">
        <div class="group-number" id="groupNum">${guest.group}</div>
        <div class="result-text">
          <p>Group</p>
          <h3>${guest.name}</h3>
        </div>
      </div>
    `;
    resultEl.classList.add('show');
    requestAnimationFrame(() => {
      const el = document.getElementById('groupNum');
      if (el) el.classList.add('pop');
    });
  }

  function renderNotFound(query) {
    resultEl.innerHTML = `
      <div class="result-divider"></div>
      <div class="result-empty">
        <p>We couldn't find "<strong>${query}</strong>" on the list. Try just your first name, or check with the organizer.</p>
      </div>
    `;
    resultEl.classList.add('show');
  }

  function renderMultiple(matches) {
    const items = matches.map(g =>
      `<button class="match-item" data-name="${g.name.replace(/"/g, '&quot;')}">${g.name} — Group ${g.group}</button>`
    ).join('');
    resultEl.innerHTML = `
      <div class="result-divider"></div>
      <div class="result-multi">
        <p>A few names matched. Which one is you?</p>
        <div class="match-list">${items}</div>
      </div>
    `;
    resultEl.classList.add('show');
    resultEl.querySelectorAll('.match-item').forEach(btn => {
      btn.addEventListener('click', () => {
        const g = guests.find(x => x.name === btn.dataset.name);
        if (g) renderFound(g);
      });
    });
  }

  function search() {
    const query = nameInput.value.trim();
    if (!query) return;
    const nq = normalize(query);

    const exact = guests.find(g => normalize(g.name) === nq);
    if (exact) return renderFound(exact);

    const contains = guests.filter(g => normalize(g.name).includes(nq) || nq.includes(normalize(g.name)));
    if (contains.length === 1) return renderFound(contains[0]);
    if (contains.length > 1) return renderMultiple(contains);

    renderNotFound(query);
  }

  searchBtn.addEventListener('click', search);
  nameInput.addEventListener('keydown', e => { if (e.key === 'Enter') search(); });

  adminToggle.addEventListener('click', () => {
    adminPanel.classList.toggle('show');
    adminToggle.textContent = adminPanel.classList.contains('show')
      ? 'Hide organizer panel'
      : 'Organizer? Set up the guest list';
  });

  saveBtn.addEventListener('click', saveData);

  await loadData();
})();
</script>

</body>
</html>
